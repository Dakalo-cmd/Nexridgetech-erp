<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexridgeTech Accounting &amp; ERP</title>
<style>
:root{
  --navy:#132436;
  --navy-2:#1c3448;
  --navy-3:#25445c;
  --ink:#1b2530;
  --ink-soft:#4b5765;
  --muted:#6b7684;
  --line:#dde2e7;
  --line-soft:#eceff2;
  --surface:#f6f7f9;
  --surface-2:#eef1f4;
  --white:#ffffff;
  --accent:#1f4e79;
  --accent-hover:#173e61;
  --success:#276b3f;
  --success-bg:#e9f4ee;
  --warning:#8a5a12;
  --warning-bg:#fbf1e0;
  --danger:#a43333;
  --danger-bg:#faeaea;
  --info:#2b5f8a;
  --info-bg:#e9f1f7;
  --radius:3px;
  --shadow:0 1px 2px rgba(19,36,54,.06);
  --shadow-md:0 4px 16px rgba(19,36,54,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--white);
  font-size:13.5px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
table{border-collapse:collapse;width:100%}
::selection{background:#cfe0ee}

.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app-shell{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{
  width:264px;flex:0 0 264px;background:var(--navy);color:#cfd8e2;
  display:flex;flex-direction:column;height:100%;transition:margin-left .18s ease;
  border-right:1px solid #0d1b28;
}
.sidebar.collapsed{margin-left:-264px}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);
  flex:0 0 auto;
}
.brand-mark{
  width:30px;height:30px;border-radius:4px;background:linear-gradient(180deg,#2c5580,#1a3b56);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
  border:1px solid rgba(255,255,255,.15);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text .t1{font-weight:600;font-size:13.5px;color:#fff}
.brand-text .t2{font-size:10.5px;color:#8fa1b3;letter-spacing:.02em}

.sidebar-scroll{flex:1;overflow-y:auto;padding:8px 0 20px;}
.sidebar-scroll::-webkit-scrollbar{width:8px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:#26405a;border-radius:4px}

.nav-group{margin-top:6px}
.nav-group-title{
  font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#7d92a6;
  padding:10px 18px 4px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:6.5px 18px 6.5px 30px;color:#c3cedb;
  font-size:12.9px;border-left:2px solid transparent;cursor:pointer;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(255,255,255,.09);color:#fff;border-left-color:#5b9bd5;font-weight:500}
.nav-item .dot{width:4px;height:4px;border-radius:50%;background:#5c7188;flex:0 0 auto}
.nav-item.active .dot{background:#5b9bd5}

/* Main column */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}

/* Topbar */
.topbar{
  height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line);background:var(--white);gap:16px;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
.icon-btn{
  width:30px;height:30px;border-radius:4px;border:1px solid transparent;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
}
.icon-btn:hover{background:var(--surface);border-color:var(--line)}
.app-title{font-weight:600;font-size:14.5px;color:var(--navy);white-space:nowrap}
.company-select{
  display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius);
  padding:5px 10px;font-size:12.5px;color:var(--ink);background:var(--surface);white-space:nowrap;
}
.company-select b{font-weight:600}
.topbar-right{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.fy-badge{
  font-size:11.8px;color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius);
  padding:5px 9px;background:var(--surface);white-space:nowrap;font-weight:500;
}
.user-chip{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
.user-avatar{
  width:28px;height:28px;border-radius:50%;background:var(--navy-2);color:#fff;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.user-meta{display:flex;flex-direction:column;line-height:1.2}
.user-meta .un{font-size:12.3px;font-weight:600;color:var(--ink)}
.user-meta .ur{font-size:10.8px;color:var(--muted)}
.notif-dot{position:relative}
.notif-dot::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;background:var(--danger);border-radius:50%;border:1.5px solid #fff}

/* Content area */
.content{flex:1;overflow-y:auto;background:var(--surface);padding:22px 26px 60px}
.content::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb{background:#d3d9df;border-radius:5px}

.breadcrumb{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.breadcrumb b{color:var(--ink-soft)}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:19px;font-weight:600;color:var(--navy);margin:0}
.page-sub{font-size:12.3px;color:var(--muted);margin-top:3px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Global screen close control */
.screen-toolbar{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  min-height:32px;
  margin:-4px 0 10px;
}
.screen-close{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--white);
  color:var(--ink-soft);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
}
.screen-close:hover{
  background:var(--surface-2);
  color:var(--navy);
}
.screen-close-icon{font-size:16px;line-height:1;color:var(--muted)}

/* Collapsible sidebar groups */
.nav-group-toggle{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 18px; border:0; background:transparent; color:#8fa1b3;
  font-family:inherit; font-size:10.5px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; cursor:pointer; text-align:left;
}
.nav-group-toggle:hover{background:rgba(255,255,255,.04);color:#fff}
.nav-group-toggle.open{color:#fff}
.nav-group-label{flex:1}
.nav-chevron{font-size:12px;color:#7d92a6}
.nav-group-toggle.open .nav-chevron{color:#fff}
.nav-subitems{display:none}
.nav-subitems.show{display:block}
.nav-subitems .nav-item{padding-left:30px}
.nav-subitems .nav-item.active{background:rgba(255,255,255,.09);color:#fff;border-left-color:#5b9bd5;font-weight:500}
.nav-subitems .nav-item .dot{width:4px;height:4px;border-radius:50%;background:#5c7188}
.nav-subitems .nav-item.active .dot{background:#5b9bd5}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--white);color:var(--ink);padding:7px 13px;font-size:12.5px;font-weight:500;
}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:4px 9px;font-size:11.8px}
.btn-danger{color:var(--danger);border-color:#e3b9b9}
.btn-danger:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Cards / surfaces */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);}
.card-header{
  padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;
}
.card-title{font-size:13px;font-weight:600;color:var(--navy)}
.card-body{padding:16px}

.grid{display:grid;gap:16px}
.grid-6{grid-template-columns:repeat(6,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1200px){.grid-6{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.grid-6,.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr}}

/* KPI card */
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.kpi-value{font-size:20px;font-weight:700;color:var(--navy);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11.3px;color:var(--muted);margin-top:4px}
.kpi-sub.up{color:var(--success)}
.kpi-sub.down{color:var(--danger)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table.data{font-size:12.6px}
table.data thead th{
  position:sticky;top:0;background:var(--surface);color:var(--ink-soft);font-weight:600;text-align:left;
  padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.3px;letter-spacing:.01em;
  text-transform:uppercase;z-index:1;
}
table.data td{padding:8px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--ink)}
table.data tbody tr:hover{background:#f9fafb}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tfoot td{padding:9px 12px;font-weight:700;border-top:1.5px solid var(--ink);background:var(--surface)}
.row-link{color:var(--accent);cursor:pointer;font-weight:500}
.row-link:hover{text-decoration:underline}
.cell-muted{color:var(--muted)}

/* Filter bar */
.filter-bar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--white);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;
}
.filter-bar .grow{flex:1;min-width:160px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10.6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line);border-radius:var(--radius);padding:6.5px 9px;color:var(--ink);background:var(--white);
  outline:none;min-width:0;
}
input:focus,select:focus,textarea:focus,button:focus-visible,.nav-item:focus-visible{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.15);
}
.search-input{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:0 9px;background:#fff}
.search-input input{border:none;padding:7px 0;flex:1}
.search-input input:focus{box-shadow:none}

/* Status pill */
.status{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:2px;font-size:11px;font-weight:600;
  border:1px solid transparent;white-space:nowrap;
}
.status-draft{background:#eef0f2;color:#5b6673;border-color:#dde1e5}
.status-pending{background:var(--warning-bg);color:var(--warning);border-color:#eddcb3}
.status-approved{background:var(--info-bg);color:var(--info);border-color:#c7dced}
.status-posted{background:var(--success-bg);color:var(--success);border-color:#c7e2cf}
.status-paid{background:var(--success-bg);color:var(--success);border-color:#c7e2cf}
.status-partial{background:var(--warning-bg);color:var(--warning);border-color:#eddcb3}
.status-overdue{background:var(--danger-bg);color:var(--danger);border-color:#eec7c7}
.status-reconciled{background:var(--success-bg);color:var(--success);border-color:#c7e2cf}
.status-reversed{background:#eef0f2;color:#5b6673;border-color:#dde1e5}
.status-voided{background:#eef0f2;color:#8a8f96;border-color:#dde1e5;text-decoration:line-through}
.status-closed{background:#eef0f2;color:#5b6673;border-color:#dde1e5}
.status-open{background:var(--success-bg);color:var(--success);border-color:#c7e2cf}
.status-locked{background:var(--danger-bg);color:var(--danger);border-color:#eec7c7}
.status-ok{background:var(--success-bg);color:var(--success);border-color:#c7e2cf}
.status-warning{background:var(--warning-bg);color:var(--warning);border-color:#eddcb3}
.status-action{background:var(--danger-bg);color:var(--danger);border-color:#eec7c7}
.status-unmatched{background:var(--danger-bg);color:var(--danger);border-color:#eec7c7}
.status-matched{background:var(--warning-bg);color:var(--warning);border-color:#eddcb3}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 14px;font-size:12.6px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* Empty / error states */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:56px 20px;color:var(--muted);
}
.empty-state .es-icon{width:38px;height:38px;color:#aab4bf;margin-bottom:10px}
.empty-state .es-title{font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.empty-state .es-desc{font-size:12.3px;max-width:360px;margin-bottom:14px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius);padding:10px 13px;font-size:12.5px;border:1px solid;margin-bottom:14px}
.banner-error{background:var(--danger-bg);border-color:#eec7c7;color:var(--danger)}
.banner-warning{background:var(--warning-bg);border-color:#eddcb3;color:var(--warning)}
.banner-info{background:var(--info-bg);border-color:#c7dced;color:var(--info)}
.banner-success{background:var(--success-bg);border-color:#c7e2cf;color:var(--success)}
.banner b{font-weight:600}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.form-grid{grid-template-columns:1fr 1fr}}
.form-section-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;margin:20px 0 10px;border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.form-section-title:first-child{margin-top:0}
.req{color:var(--danger)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(19,28,38,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:4px;width:100%;max-width:640px;box-shadow:var(--shadow-md);border:1px solid var(--line)}
.modal.modal-lg{max-width:900px}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:14.5px;font-weight:600;color:var(--navy)}
.modal-body{padding:18px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:4px;font-size:12.5px;box-shadow:var(--shadow-md);max-width:340px}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 0;font-size:11.8px;color:var(--muted)}
.pagination .pg-btns{display:flex;gap:4px}

/* Ledger detail line */
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){color:var(--ink);font-weight:500}

/* Simple chart bars */
.chart-box{padding:6px 4px 0}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:9px;height:9px;border-radius:1px}

/* Bank reconciliation columns */
.recon-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.recon-line{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;font-size:12.4px;background:#fff}
.recon-line.selected{border-color:var(--accent);background:#eef4fa}
.recon-line.matched{opacity:.45}
.recon-line .amt{font-weight:600;font-variant-numeric:tabular-nums}

/* Sidebar toggle small screens */
.mobile-nav-toggle{display:none}
@media(max-width:920px){
  .sidebar{position:fixed;z-index:60;margin-left:-264px;box-shadow:var(--shadow-md)}
  .sidebar.open{margin-left:0}
  .mobile-nav-toggle{display:flex}
  .content{padding:16px}
  .form-grid{grid-template-columns:1fr}
}
.badge-count{background:var(--danger);color:#fff;font-size:10px;border-radius:8px;padding:1px 6px;font-weight:700}
.help-text{font-size:11px;color:var(--muted);margin-top:2px}
hr.sep{border:none;border-top:1px solid var(--line-soft);margin:16px 0}
.text-muted{color:var(--muted)}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.right{text-align:right}
.mt0{margin-top:0}
.small{font-size:11.5px}
.print-only{display:none}
/* ---------- Professional print layouts ---------- */
.print-header{display:none}
.print-footer{display:none}
@page{size:A4 portrait;margin:14mm 12mm 16mm}
@media print{
  html,body{height:auto !important;background:#fff !important}
  body{font-size:10.5pt;line-height:1.35;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .app-shell{display:block;height:auto;overflow:visible}
  .sidebar,.topbar,.page-actions,.filter-bar,.screen-toolbar,.no-print,.toast-wrap{display:none !important}
  .content{display:block;overflow:visible;padding:0;background:#fff !important}
  .print-header{display:flex !important;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 12mm;padding-bottom:5mm;border-bottom:2px solid #132436}
  .print-header .ph-company{font-size:15pt;font-weight:700;color:#132436}
  .print-header .ph-report{font-size:12pt;font-weight:600;color:#1b2530;margin-top:2px}
  .print-header .ph-meta{font-size:8.5pt;color:#555;text-align:right;line-height:1.5}
  .breadcrumb{display:none !important}
  .page-header{margin:0 0 5mm !important}
  .page-title{font-size:16pt !important;color:#132436 !important}
  .page-sub{font-size:9pt !important;color:#555 !important}
  .card,.kpi{border:1px solid #cfd5db !important;box-shadow:none !important;break-inside:avoid}
  .card-header{background:#f3f5f7 !important}
  table{width:100% !important}
  table.data{font-size:9.5pt !important}
  table.data thead{display:table-header-group}
  table.data tfoot{display:table-footer-group}
  table.data th{background:#eef1f4 !important;color:#222 !important;position:static !important}
  table.data td,table.data th{padding:5px 7px !important}
  table.data tr{break-inside:avoid;page-break-inside:avoid}
  .table-wrap{overflow:visible !important}
  .row-link{color:#111 !important;text-decoration:none !important}
  .status{border:1px solid #aaa !important;background:#fff !important;color:#222 !important}
  .banner{break-inside:avoid}
  .grid{gap:8mm}
  .grid-6{grid-template-columns:repeat(3,1fr) !important}
  .grid-4{grid-template-columns:repeat(2,1fr) !important}
  .grid-3{grid-template-columns:repeat(2,1fr) !important}
  .grid-2{grid-template-columns:1fr 1fr !important}
  .print-only{display:block !important}
  .print-footer{display:block !important;margin-top:8mm;padding-top:3mm;border-top:1px solid #ccd2d8;font-size:8pt;color:#666;text-align:center}

  /* Invoice / modal print layout */
  .modal-overlay{position:static !important;display:block !important;padding:0 !important;background:#fff !important;overflow:visible !important}
  .modal{max-width:none !important;width:100% !important;border:0 !important;box-shadow:none !important;border-radius:0 !important}

function fmt(n){
  n = Number(n)||0;
  const neg = n < 0;
  n = Math.abs(n);
  const s = n.toLocaleString('en-ZA', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg? '-R ' : 'R ') + s;
}
function fmtDate(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt)) return '-';
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${dt.getFullYear()}`;
}
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}
function ageBucket(dueDate, asOf){
  const due = new Date(dueDate); const ref = asOf || new Date('2026-09-14');
  const days = Math.floor((ref - due)/(1000*60*60*24));
  if(days <= 0) return 'current';
  if(days <= 30) return 'd30';
  if(days <= 60) return 'd60';
  if(days <= 90) return 'd90';
  return 'd120';
}
function statusPill(status){
  const key = status.toLowerCase().replace(/\s+/g,'');
  const map = {
    draft:'status-draft', pendingapproval:'status-pending', approved:'status-approved',
    posted:'status-posted', paid:'status-paid', partiallypaid:'status-partial', overdue:'status-overdue',
    reconciled:'status-reconciled', reversed:'status-reversed', voided:'status-voided', closed:'status-closed',
    open:'status-open', locked:'status-locked', ok:'status-ok', warning:'status-warning',
    actionrequired:'status-action', unmatched:'status-unmatched', matched:'status-matched', sent:'status-approved',
    submitted:'status-pending', received:'status-approved', closing:'status-pending'
  };
  const cls = map[key] || 'status-draft';
  return `<span class="status ${cls}">${esc(status)}</span>`;
}

const AR_AGING = CUSTOMERS.map(c=>{
  const invs = INVOICES.filter(i=>i.customer===c.name && i.status!=='Paid' && i.status!=='Draft');
  const buckets = {current:0,d30:0,d60:0,d90:0,d120:0};
  invs.forEach(i=>{ const b=ageBucket(i.due); buckets[b]+= (i.total-i.paid); });
  const total = Object.values(buckets).reduce((a,b)=>a+b,0);
  return {customer:c.name, ...buckets, total, invoices:invs};
}).filter(r=>r.total>0.004 || true);

const AP_AGING = SUPPLIERS.map(s=>{
  const bl = BILLS.filter(b=>b.supplier===s.name && b.status!=='Paid');
  const buckets = {current:0,d30:0,d60:0,d90:0,d120:0};
  bl.forEach(b=>{ const bucket=ageBucket(b.due); buckets[bucket]+= b.total; });
  const total = Object.values(buckets).reduce((a,b)=>a+b,0);
  return {supplier:s.name, ...buckets, total, bills:bl};
});

function openGlobalSearch(seed=''){
  const q=seed||'';

  const data=[...CUSTOMERS.map(x=>({label:x.name,key:'customers',group:'Customer'})),...SUPPLIERS.map(x=>({label:x.name,key:'suppliers',group:'Supplier'})),...all];

    const t=String(term||'').trim().toLowerCase();

}

function renderSidebar(){
  const el = document.getElementById('navContainer');

  NAV.forEach(g=>{
    if(!g.group){
      html += `<div class="nav-group">`;
      g.items.forEach(it=>{
        const active = STATE.route===it.key ? 'active' : '';
        html += `<a class="nav-item ${active}" onclick="navigate('${it.key}')" tabindex="0"><span class="dot"></span>${esc(it.label)}</a>`;
      });
      html += `</div>`;
      return;
    }

    const hasActiveItem = g.items.some(it => STATE.route === it.key);
    const isOpen = STATE.openNavGroup === g.group || (!STATE.openNavGroup && hasActiveItem);
    const safeGroup = g.group.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

    html += `
      <div class="nav-group">

          onclick="toggleNavGroup('${safeGroup}')" aria-expanded="${isOpen}">
          <span class="nav-group-label">${esc(g.group)}</span>
          <span class="nav-chevron" aria-hidden="true">${isOpen ? '▾' : '▸'}</span>

function svgBarChart(seriesArr, labels, opts){
  // seriesArr: [{name,color,values:[...]}]
  opts = opts||{}; const W=opts.w||620, H=opts.h||220, padL=54, padB=26, padT=10, padR=10;
  const max = Math.max(1, ...seriesArr.flatMap(s=>s.values));
  const niceMax = Math.ceil(max/50000)*50000 || max*1.2;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const groupW = innerW/labels.length;
  const barW = Math.min(22, groupW/(seriesArr.length+1.4));
  let bars='', axis='';
  for(let g=0; g<=4; g++){
    const y = padT + innerH - (innerH*g/4);
    const val = niceMax*g/4;
    axis += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e7eaed" stroke-width="1"/>
      <text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#8b95a1">${Math.round(val/1000)}k</text>`;
  }
  labels.forEach((lab,i)=>{
    const groupX = padL + i*groupW;
    seriesArr.forEach((s,si)=>{
      const v = s.values[i]||0;
      const h = (v/niceMax)*innerH;
      const x = groupX + (groupW/2) - (seriesArr.length*barW)/2 + si*barW + (groupW*0.06);
      bars += `<rect x="${x.toFixed(1)}" y="${(padT+innerH-h).toFixed(1)}" width="${barW-3}" height="${h.toFixed(1)}" fill="${s.color}" rx="1"></rect>`;
    });
    axis += `<text x="${groupX+groupW/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b7684">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="chart">
    <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#c7cdd3"/>
    ${axis}${bars}</svg>`;
}

function svgLineChart(seriesArr, labels, opts){
  opts=opts||{}; const W=opts.w||620, H=opts.h||220, padL=54, padB=26, padT=10, padR=10;
  const max = Math.max(1, ...seriesArr.flatMap(s=>s.values));
  const niceMax = Math.ceil(max/50000)*50000 || max*1.2;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const stepX = innerW/(labels.length-1||1);
  let grid='', lines='';
  for(let g=0; g<=4; g++){
    const y = padT + innerH - (innerH*g/4);
    const val = niceMax*g/4;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e7eaed" stroke-width="1"/>
      <text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#8b95a1">${Math.round(val/1000)}k</text>`;
  }
  labels.forEach((lab,i)=>{
    grid += `<text x="${padL+stepX*i}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b7684">${esc(lab)}</text>`;
  });
  seriesArr.forEach(s=>{
    let pts='';
    s.values.forEach((v,i)=>{
      const x = padL+stepX*i, y = padT+innerH-(v/niceMax)*innerH;
      pts += `${x.toFixed(1)},${y.toFixed(1)} `;
    });
    lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.values.forEach((v,i)=>{
      const x = padL+stepX*i, y = padT+innerH-(v/niceMax)*innerH;
      lines += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${s.color}"/>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${grid}${lines}</svg>`;
}

    </select></td>

    </button></td>`;
  body.appendChild(tr);
}
function recalcJE(el, kind){
  if(el){
    const tr = el.closest('tr');
    const debitInput = tr.children[2].querySelector('input');
    const creditInput = tr.children[3].querySelector('input');
    if(kind==='debit' && parseFloat(el.value)>0) creditInput.value='';
    if(kind==='credit' && parseFloat(el.value)>0) debitInput.value='';
  }
  let td=0, tc=0;
  document.querySelectorAll('#jeLinesBody tr').forEach(tr=>{
    td += parseFloat(tr.children[2].querySelector('input').value)||0;
    tc += parseFloat(tr.children[3].querySelector('input').value)||0;
  });
  document.getElementById('jeTotalDebit').textContent = fmt(td);
  document.getElementById('jeTotalCredit').textContent = fmt(tc);
  const diff = td-tc;
  const diffEl = document.getElementById('jeDiff');
  diffEl.textContent = fmt(diff);
  diffEl.style.color = Math.abs(diff)<0.005 ? 'var(--success)' : 'var(--danger)';
  const postBtn = document.getElementById('jePostBtn');
  const balanced = Math.abs(diff)<0.005 && td>0;
  postBtn.disabled = !balanced;
  const holder = document.getElementById('jeBannerHolder');
  holder.innerHTML = balanced
    ? `<div class="banner banner-success" style="margin-top:12px"><b>Debits = Credits.</b> This journal is balanced and can be posted.</div>`
    : `<div class="banner banner-error" style="margin-top:12px"><b>Journal is not balanced.</b> Debits must equal credits before this journal can be posted.</div>`;
}

  closeModal();
}

function addInvLine(){
  const body = document.getElementById('invLinesBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" style="width:100%" placeholder="Item / service description"></td>
    <td><input type="number" value="1" style="width:100%;text-align:right" oninput="recalcInvoice()"></td>
    <td><input type="number" step="0.01" value="0" style="width:100%;text-align:right" oninput="recalcInvoice()"></td>
    <td><input type="number" step="0.01" value="0" style="width:100%;text-align:right" oninput="recalcInvoice()"></td>
    <td class="num line-vat">R 0.00</td>
    <td class="num line-total">R 0.00</td>`;
  body.appendChild(tr);
}
function recalcInvoice(){
  let subtotal=0, vat=0;
  document.querySelectorAll('#invLinesBody tr').forEach(tr=>{
    const qty = parseFloat(tr.children[1].querySelector('input').value)||0;
    const price = parseFloat(tr.children[2].querySelector('input').value)||0;
    const disc = parseFloat(tr.children[3].querySelector('input').value)||0;
    const lineBase = qty*price*(1-disc/100);
    const lineVat = lineBase*0.15;
    tr.querySelector('.line-vat').textContent = fmt(lineVat);
    tr.querySelector('.line-total').textContent = fmt(lineBase+lineVat);
    subtotal += lineBase; vat += lineVat;
  });
  document.getElementById('invSubtotal').textContent = fmt(subtotal);
  document.getElementById('invVat').textContent = fmt(vat);
  document.getElementById('invTotal').textContent = fmt(subtotal+vat);
}

/* ---- 7.14 Financial Statements ---- */
function incomeStatementData(){
  const revenue = ACCOUNTS.filter(a=>a.type==='Revenue');
  const cos = ACCOUNTS.filter(a=>a.type==='Cost of Sales');
  const exp = ACCOUNTS.filter(a=>a.type==='Expenses');
  const totalRev = revenue.reduce((s,a)=>s+a.balance,0);
  const totalCos = cos.reduce((s,a)=>s+a.balance,0);
  const grossProfit = totalRev-totalCos;
  const totalExp = exp.reduce((s,a)=>s+a.balance,0);
  const netProfit = grossProfit-totalExp;
  return {revenue,cos,exp,totalRev,totalCos,grossProfit,totalExp,netProfit};
}

/* -------------------------------------------------------------------------
   8. MAIN RENDER
   ------------------------------------------------------------------------- */
function printCurrentScreen(){
  const content=document.getElementById('content');
  if(!content) return;
  document.getElementById('activePrintHeader')?.remove();
  document.getElementById('activePrintFooter')?.remove();

  const company=currentCompany();
  const p=printProfile(company);
  const titleEl=document.querySelector('.page-title');
  const modalTitle=document.querySelector('.modal-title');
  const reportTitle=(titleEl?.textContent||modalTitle?.textContent||'Business Report').trim();
  const now=new Date();
  const date=now.toLocaleDateString('en-ZA',{year:'numeric',month:'2-digit',day:'2-digit'});
  const time=now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
  const logo=document.querySelector('.brand-mark')?.getAttribute('src')||'';
  const isTaxInvoice=/tax invoice/i.test(reportTitle);
  const missingTaxFields=isTaxInvoice?printTaxInvoiceMissingFields(p):[];
  const address=printAddressLines(p);
  const contact=printContactLine(p);

  const header=document.createElement('div');
  header.id='activePrintHeader';
  header.className='print-document-header';
  header.innerHTML=`
    <div class="print-brand">
      ${logo?`<img src="${logo}" alt="${esc(p.legalName)} logo">`:''}
      <div class="print-brand-copy">
        <div class="print-brand-name">${esc(p.legalName)}</div>
        ${p.tradingName?`<div class="print-brand-trading">Trading as ${esc(p.tradingName)}</div>`:''}
        <div class="print-brand-sub">${esc(p.slogan)}</div>
        ${address?`<div class="print-brand-address">${esc(address)}</div>`:''}
        ${contact?`<div class="print-brand-contact">${esc(contact)}</div>`:''}
        <div class="print-brand-reg">Reg No. ${esc(p.registrationNumber)}${p.vatNumber?` · VAT No. ${esc(p.vatNumber)}`:''}</div>
      </div>
    </div>
    <div class="print-document-meta">
      <div class="print-document-label">${esc(isTaxInvoice?p.documentLabel:reportTitle)}</div>
      <div><strong>Company</strong> ${esc(p.legalName)}</div>
      ${p.vatNumber?`<div><strong>VAT No.</strong> ${esc(p.vatNumber)}</div>`:''}
      <div><strong>Generated</strong> ${esc(date)} ${esc(time)}</div>
      <div><strong>Currency</strong> ${esc(p.currency)}</div>
    </div>`;
  content.prepend(header);
  if(isTaxInvoice && missingTaxFields.length){
    const warning=document.createElement('div');
    warning.id='activePrintComplianceWarning';
    warning.className='print-compliance-warning';
    warning.innerHTML=`CONFIGURATION REQUIRED — NOT FOR ISSUE: ${esc(missingTaxFields.join(', '))}. Complete the licensed company’s print/tax profile before issuing this document.`;
    content.insertBefore(warning,header.nextSibling);
  }

  const footer=document.createElement('div');
  footer.id='activePrintFooter';
  footer.className='print-footer';
  const footerLeft=p.footerNote || `${p.legalName} · ${p.registrationNumber ? `Reg No. ${p.registrationNumber}` : ''}${p.vatNumber ? ` · VAT No. ${p.vatNumber}` : ''}`;
  footer.innerHTML=`<span>${esc(footerLeft)}</span><span class="pf-right">${esc(p.slogan)} · Generated ${esc(date)} ${esc(time)}</span>`;
  content.appendChild(footer);

  document.body.classList.add('printing');
  const cleanup=()=>{
    header.remove();footer.remove();document.getElementById('activePrintComplianceWarning')?.remove();document.body.classList.remove('printing');
    window.removeEventListener('afterprint',cleanup);
  };
  window.addEventListener('afterprint',cleanup);
  window.print();
  setTimeout(()=>{ if(document.body.classList.contains('printing') && !window.matchMedia('print').matches) cleanup(); },1200);
}

    html+=`<div class="nav-group"><button type="button" class="nav-group-toggle ${isOpen?'open':''}" onclick="toggleNavGroup('${safe}')" aria-expanded="${isOpen}"><span class="nav-group-label">${esc(g.group)}</span><span class="nav-chevron">${isOpen?'▾':'▸'}</span></button><div class="nav-subitems ${isOpen?'show':''}">${items.map(it=>`<a class="nav-item ${STATE.route===it.key?'active':''}" onclick="navigate('${it.key}')" tabindex="0"><span class="dot"></span>${esc(it.label)}</a>`).join('')}</div></div>`;
  });
  html+=`<div class="nav-role-note">Signed in as ${esc(uxRole().workspace)} · role-based navigation</div>`;
  el.innerHTML=html;
}
function navigate(route){
  if(!uxAllowed(route)){ toast('This workspace does not include that area. Ask an administrator for access.'); return; }
  STATE.route=route; const activeGroup=NAV.find(g=>g.group&&g.items.some(it=>it.key===route));
  if(activeGroup) STATE.openNavGroup=activeGroup.group; else if(route==='dashboard') STATE.openNavGroup=null;
  window.location.hash='#/'+route; renderAll();
  const content=document.getElementById('content'); if(content) content.scrollTop=0;
  document.getElementById('sidebar').classList.remove('open');
}
function openUserMenu(){
  const u=currentUser(), r=uxRole();
  const opts=Object.keys(UX_ROLES).map(role=>`<button class="role-option ${role===STATE.uxRole?'active':''}" onclick="uxSwitchRole('${role.replace(/'/g,"\\'")}')"><strong>${esc(role)}</strong><span>${esc(UX_ROLES[role].description)}</span></button>`).join('');
  showModal('My Workspace & Account',`<div class="kv"><div>User</div><div>${esc(u.name)}</div><div>Role</div><div>${esc(u.role)}</div><div>Workspace</div><div>${esc(r.workspace)}</div><div>Company</div><div>${esc(currentCompany().name)}</div></div><div class="form-section-title" style="margin-top:16px">Switch demo workspace</div><div class="small text-muted">This selector demonstrates the user experience. Production access must come from backend authentication and permissions.</div><div class="user-role-switch">${opts}</div><div class="user-menu-actions"><button class="btn" onclick="closeModal();navigate('security-centre')">Security</button><button class="btn" onclick="closeModal();navigate('help-centre')">Help</button><button class="btn" onclick="toast('Sign-out flow is backend controlled.')">Sign out</button></div>`,[]);
}

  const data={
    'Business Owner':[['Revenue','R 2.8M','Year to date'],['Cash','R 842K','Available cash'],['Receivables','R 486K','Outstanding'],['Approvals','3','Need your attention']],
    'Bookkeeper':[['To reconcile','34','Bank items'],['Bills to capture','8','Supplier documents'],['Receipts to allocate','12','Customer cash'],['Exceptions','3','Need review']],
    'Accountant':[['Close status','72%','Period checklist'],['AR','R 486K','Outstanding'],['AP','R 219K','Outstanding'],['VAT review','1','Difference to resolve']],
    'Auditor':[['Audit items','11','Open exceptions'],['Manual journals','7','This period'],['Changes traced','42','Recent records'],['Read-only','Active','Access mode']],
    'Payroll Administrator':[['Employees','48','Active records'],['Pay run','Draft','September 2026'],['Exceptions','3','Need review'],['EMP201','Ready','August 2026']],
    'IT Administrator':[['Users','24','Configured users'],['Security','OK','Current posture'],['Integrations','6','Configured connections'],['API status','Ready','Frontend contract']],
    'Administrator':[['Companies','3','Licensed tenants'],['Users','24','Platform users'],['Approvals','3','Pending'],['Exceptions','11','Open issues']]
  }[STATE.uxRole]||[];
  const cards=data.map(x=>`<div class="kpi"><div class="kpi-label">${esc(x[0])}</div><div class="kpi-value">${esc(x[1])}</div><div class="kpi-sub">${esc(x[2])}</div></div>`).join('');
  return `<div class="page-header"><div><h1 class="page-title">${esc(r.workspace)} Centre</h1><div class="page-sub">${esc(c.name)} · ${esc(r.description)}</div></div><div class="page-actions"><button class="btn" onclick="openGlobalSearch()">Search</button><button class="btn btn-primary" onclick="openQuickCreate()">+ Create</button></div></div>
  <div class="ux-welcome"><div><h2>Welcome back</h2><p>Your workspace is configured for <b>${esc(STATE.uxRole)}</b>. Only the areas relevant to this role are shown.</p></div><span class="role-pill">${esc(r.workspace)} workspace</span></div>
  <div class="grid grid-4">${cards}</div>
  <div class="card" style="margin-top:16px"><div class="card-header"><span class="card-title">Quick actions</span><span class="small text-muted">Common tasks for this role</span></div><div class="card-body"><div class="ux-quick-grid">${q}</div></div></div>
  <div class="grid grid-2" style="margin-top:16px"><div class="card"><div class="card-header"><span class="card-title">How work flows</span></div><div class="card-body"><div class="ux-flow"><span class="ux-flow-step">Create</span><span class="ux-flow-arrow">→</span><span class="ux-flow-step">Review</span><span class="ux-flow-arrow">→</span><span class="ux-flow-step">Approve</span><span class="ux-flow-arrow">→</span><span class="ux-flow-step">Post</span><span class="ux-flow-arrow">→</span><span class="ux-flow-step">Report</span></div><div class="small text-muted" style="margin-top:10px">The backend will enforce approvals, segregation of duties, posting and tenant isolation.</div></div></div><div class="card"><div class="card-header"><span class="card-title">Need help?</span></div><div class="card-body"><div class="ux-help"><div class="help-icon">?</div><div><b>Not sure where to start?</b><div class="small text-muted">Use Search, + Create, or open the Help Centre for guided instructions.</div></div><button class="btn btn-sm" onclick="navigate('help-centre')">Help Centre</button></div></div></div></div>`;
}
PAGES.dashboard=PAGES_roleDashboard;
function PAGES_integrationUX(){
 return `<div class="page-header"><div><h1 class="page-title">Integrations</h1><div class="page-sub">Connect NexridgeTech ERP to banks, payroll, payments, CRM, commerce and custom systems.</div></div><div class="page-actions"><button class="btn" onclick="navigate('api-developer')">Developer API</button><button class="btn btn-primary" onclick="openIntegrationWizard()">+ Connect System</button></div></div>
 <div class="banner banner-info">Friendly setup for business users; advanced credentials, mappings and webhooks remain available to IT administrators. Production connections must be created and secured by the backend.</div>
 <div class="integration-steps"><div class="integration-step"><b>1. Connect</b><span>Authorise the external system.</span></div><div class="integration-step"><b>2. Map</b><span>Match fields and accounts.</span></div><div class="integration-step"><b>3. Test</b><span>Validate a safe sample sync.</span></div><div class="integration-step"><b>4. Monitor</b><span>Review sync status and errors.</span></div></div>
 <div class="module-catalog">${[['Banking','Bank feeds and reconciliation','banking'],['Payroll','Employee and payroll exchange','payroll'],['Payments','Payment providers and settlement','payments'],['CRM','Customers, leads and activities','crm'],['E-commerce','Orders, products and customers','commerce'],['Custom API','REST/OAuth/webhooks/field mapping','custom']].map(x=>`<div class="module-card"><div class="mc-title">${x[0]}</div><div class="mc-sub">${x[1]}</div><button class="btn btn-sm" onclick="openIntegrationWizard('${x[2]}')">Connect</button></div>`).join('')}</div>`;

function openIntegrationWizard(type='custom'){
 const name={banking:'Banking',payroll:'Payroll',payments:'Payments',crm:'CRM',commerce:'E-commerce',custom:'Custom API'}[type]||'External System';
 showModal('Connect '+name,`<div class="form-section-title">Step 1 · Connection</div><div class="form-grid"><div class="field"><label>System</label><input value="${esc(name)}" disabled></div><div class="field"><label>Authentication</label><select><option>OAuth 2.0</option><option>API Key</option><option>Client Credentials</option></select></div></div><div class="form-section-title">Step 2 · Sync</div><div class="form-grid"><div class="field"><label>Direction</label><select><option>Two-way</option><option>ERP → External</option><option>External → ERP</option></select></div><div class="field"><label>Frequency</label><select><option>Real-time / Webhook</option><option>Hourly</option><option>Daily</option><option>Manual</option></select></div></div><div class="form-section-title">Step 3 · Test</div><div class="banner banner-warning">No external system is actually connected in this frontend prototype. The backend will own secrets, OAuth tokens, retries, queues, mappings and audit logs.</div>`,[`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="closeModal();toast('Connection configuration saved as a frontend demo.')">Save Configuration</button>`],{large:true});
}
PAGES['help-centre']=function(){return `<div class="page-header"><div><h1 class="page-title">Help Centre</h1><div class="page-sub">Plain-language guidance for every role.</div></div></div><div class="module-catalog"><div class="module-card"><div class="mc-title">Getting started</div><div class="mc-sub">Learn the dashboard, Search, + Create and company switcher.</div><button class="btn btn-sm" onclick="toast('Getting started guide opened (demo).')">Open Guide</button></div><div class="module-card"><div class="mc-title">Accounting help</div><div class="mc-sub">Understand invoices, bills, bank reconciliation, journals and period close.</div><button class="btn btn-sm" onclick="navigate('gl')">Open Accounting</button></div><div class="module-card"><div class="mc-title">Payroll help</div><div class="mc-sub">Employee records, pay runs, payslips and statutory workflows.</div><button class="btn btn-sm" onclick="navigate('pay-runs')">Open Payroll</button></div><div class="module-card"><div class="mc-title">IT & integrations</div><div class="mc-sub">Users, roles, security, API access and external system connections.</div><button class="btn btn-sm" onclick="navigate('integrations')">Open Integrations</button></div></div><div class="ux-help" style="margin-top:14px"><div class="help-icon">i</div><div><b>Contextual help</b><div class="small text-muted">Production can attach help articles, training videos and support tickets to each screen.</div></div></div>`;};
function renderAll(){
 renderSidebar(); renderTopbar(); const el=document.getElementById('content'); const renderer=PAGES[STATE.route];
 if(renderer && uxAllowed(STATE.route)) el.innerHTML=(STATE.route!=='dashboard'?`<div class="screen-toolbar"><button type="button" class="screen-close" onclick="closeScreen()" title="Return to your workspace">× &nbsp; Close</button></div>`:'')+renderer();
 else { STATE.route='dashboard'; window.location.hash='#/dashboard'; el.innerHTML=PAGES.dashboard(); }
}
</script>
